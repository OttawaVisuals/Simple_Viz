<title>How Much Energy Is in Matter?</title>
<style>
  :root{--bg:#0b0d10;--fg:#e9edf0;--muted:#8a94a0;--line:#262d34;--mass:#8fa0ff;--energy:#ffcc55;--accent:#52d6c9}@media(prefers-color-scheme:light){:root{--bg:#fbfaf8;--fg:#1c2226;--muted:#6b7480;--line:#e0dfda;--mass:#4a5bc9;--energy:#b8790a;--accent:#0f8f82}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;padding:3.5rem 1.5rem 5rem;display:flex;justify-content:center}main{width:100%;max-width:820px}a{color:var(--muted);font:12px ui-monospace,monospace;text-decoration:none}a:hover{color:var(--fg)}h1{font-size:clamp(1.9rem,5vw,3.1rem);font-weight:400;letter-spacing:-.025em;margin:2rem 0 .8rem}.sub{color:var(--muted);font-size:1.06rem;line-height:1.6;max-width:62ch;margin:0 0 2.5rem}.sub b{color:var(--fg);font-weight:400}.mono{font-family:ui-monospace,"Cascadia Code",monospace;font-variant-numeric:tabular-nums}.equation{display:flex;align-items:center;gap:.65rem;font-size:clamp(2.1rem,8vw,4.5rem);margin:1rem 0 2rem}.equation span{color:var(--muted)}.equation strong{font-weight:400;color:var(--energy)}.controls{border-top:1px solid var(--line);padding-top:1.2rem;display:flex;gap:1.5rem;flex-wrap:wrap;align-items:end;font:13px system-ui,sans-serif}.controls label{display:grid;gap:.5rem;color:var(--muted)}input{accent-color:var(--accent);width:250px}.preset{border:0;border-bottom:1px solid var(--muted);background:none;color:var(--fg);font:inherit;padding:0;cursor:pointer;margin-right:.75rem}.preset:hover{border-color:var(--fg)}svg{display:block;width:100%;height:auto;margin-top:2.4rem}.label{font:14px ui-monospace,"Cascadia Code",monospace;fill:currentColor}.small{font:12px ui-monospace,"Cascadia Code",monospace;fill:var(--muted)}.note{margin-top:2rem;border-top:1px solid var(--line);padding-top:1rem;color:var(--muted);font:12px/1.55 system-ui,sans-serif}
</style>
<main>
  <a href="../index.html">&larr; Physics you can see</a>
  <h1>How much energy is in matter?</h1>
  <p class="sub">Einstein&rsquo;s equation says mass and energy are interchangeable. Move the mass slider to see the energy equivalent if <b>all</b> of that mass could be converted to energy.</p>
  <div class="equation" aria-label="E equals m c squared"><strong>E</strong><span>=</span><strong>m</strong><span>c<sup>2</sup></span></div>
  <p class="mono" style="color:var(--muted);font-size:13px;margin:-1.4rem 0 2rem">c = 299,792,458 m/s &nbsp; therefore &nbsp; E = m &times; 89,875,517,873,681,764 J/kg</p>
  <div class="controls"><label>Mass <span class="mono" id="massReadout"></span><input id="mass" type="range" min="-6" max="3" step=".01" value="-3"></label><div>Try: <button class="preset" data-m="-3">paperclip</button><button class="preset" data-m="-1">coin</button><button class="preset" data-m="0">1 kg</button><button class="preset" data-m="2">100 kg</button></div></div>
  <svg viewBox="0 0 820 320" role="img" aria-label="A mass object transformed into its mass energy equivalent, shown as electricity, TNT equivalent, and lightning strikes.">
    <text x="35" y="55" class="small">MASS</text><circle id="massDot" cx="112" cy="145" r="34" fill="var(--mass)"/><text id="massSvg" x="112" y="205" text-anchor="middle" class="label">1 g</text>
    <path d="M 175 145 L 330 145" stroke="currentColor" stroke-opacity=".35"/><polygon points="330,145 316,137 316,153" fill="currentColor" opacity=".5"/><text x="252" y="126" text-anchor="middle" class="small">&times; c²</text>
    <text x="370" y="55" class="small">ENERGY EQUIVALENT</text><rect x="370" y="108" width="385" height="70" fill="none" stroke="currentColor" stroke-opacity=".2"/><rect id="energyBar" x="370" y="108" width="1" height="70" fill="var(--energy)" opacity=".85"/><text id="energyText" x="370" y="205" class="label">0 J</text>
    <line x1="35" y1="260" x2="785" y2="260" stroke="currentColor" stroke-opacity=".2"/><text x="35" y="292" class="small" id="electricity">&nbsp;</text><text x="415" y="292" class="small" id="tnt">&nbsp;</text>
  </svg>
  <p class="note" id="note">&nbsp;</p>
</main>
<script>
(function(){var mass=document.getElementById('mass'),massReadout=document.getElementById('massReadout'),massSvg=document.getElementById('massSvg'),energyText=document.getElementById('energyText'),energyBar=document.getElementById('energyBar'),massDot=document.getElementById('massDot'),electricity=document.getElementById('electricity'),tnt=document.getElementById('tnt'),note=document.getElementById('note');function fixed(n){return n>=1e12?(n/1e12).toFixed(2)+' TJ':n>=1e9?(n/1e9).toFixed(2)+' GJ':n>=1e6?(n/1e6).toFixed(2)+' MJ':n.toLocaleString(undefined,{maximumFractionDigits:0})+' J'}function draw(){var m=Math.pow(10,Number(mass.value)),E=m*299792458**2,kwh=E/3600000,tons=E/4.184e9;massReadout.textContent=m<.001?(m*1e6).toFixed(1)+' mg':m<1?(m*1000).toFixed(1)+' g':m.toFixed(2)+' kg';massSvg.textContent=massReadout.textContent;energyText.textContent=fixed(E);energyBar.setAttribute('width',Math.max(4,385*(Number(mass.value)+6)/9));massDot.setAttribute('r',18+(Number(mass.value)+6)*3);electricity.textContent='enough to run a 1 kW heater for '+(kwh<24?kwh.toFixed(1)+' hours':(kwh/24).toFixed(1)+' days');tnt.textContent='about '+(tons<1?(tons*1000).toFixed(1)+' kg':tons.toLocaleString(undefined,{maximumFractionDigits:0})+' tonnes')+' of TNT';note.textContent='This is mass–energy equivalence, not a promise that an ordinary object can release all of this energy. Complete conversion is a useful theoretical comparison; real processes convert only a fraction of mass.'}mass.oninput=draw;document.querySelectorAll('.preset').forEach(function(b){b.onclick=function(){mass.value=b.dataset.m;draw()}});draw()})();
</script>
