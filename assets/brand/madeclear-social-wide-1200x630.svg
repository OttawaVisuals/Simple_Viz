<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Made clear — Physics you can see</title>
  <desc id="desc">Interactive experiments that make physics and mathematical ideas visible.</desc>
  <rect width="1200" height="630" fill="#F7F5F0"/>

  <g transform="translate(94 145)">
    <text x="190" y="154" fill="#1B1A17" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="190" font-style="italic">mc</text>
    <path d="M12 240 C32 240 32 190 52 190 S72 290 92 290 S112 160 132 160 S152 260 172 260 S192 220 212 220 L378 220"
      fill="none" stroke="#2F6BD8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <line x1="535" y1="118" x2="535" y2="512" stroke="#E2DDD2" stroke-width="2"/>

  <g transform="translate(610 178)">
    <text x="0" y="0" fill="#6E675D" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="3">MADE CLEAR</text>
    <text x="0" y="92" fill="#1B1A17" font-family="Georgia, 'Times New Roman', serif" font-size="64">Physics you can see.</text>
    <text x="0" y="154" fill="#4A463F" font-family="Georgia, 'Times New Roman', serif" font-size="27">Small interactive experiments for ideas</text>
    <text x="0" y="194" fill="#4A463F" font-family="Georgia, 'Times New Roman', serif" font-size="27">usually hidden inside numbers.</text>
    <text x="0" y="286" fill="#2F6BD8" font-family="Consolas, 'Courier New', monospace" font-size="20" letter-spacing="2">MADECLEAR.CA</text>
  </g>
</svg>
